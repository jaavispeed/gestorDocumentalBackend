services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gestor_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
